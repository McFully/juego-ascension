<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 350" width="100%" height="100%">
  <defs>
    <radialGradient id="cyborgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </radialGradient>
    <linearGradient id="cyborgMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#485460"/>
      <stop offset="50%" stop-color="#1e272e"/>
      <stop offset="100%" stop-color="#05070f"/>
    </linearGradient>
  </defs>

  <!-- Cuerpo y hombros mecánicos cartoon -->
  <path d="M 50,220 L 150,200 L 250,220 L 270,350 L 30,350 Z" fill="url(#cyborgMetal)" stroke="#00d2d3" stroke-width="5"/>
  <rect x="135" y="240" width="30" height="70" rx="6" fill="#00f2fe" stroke="#0c1836" stroke-width="3"/>

  <!-- Cuello con pistones -->
  <rect x="125" y="150" width="50" height="50" fill="#2d3436" stroke="#00d2d3" stroke-width="4"/>

  <!-- Cabeza de androide esférica cartoon (tipo robot retro/Chrono Trigger) -->
  <circle cx="150" cy="115" r="70" fill="#d2dae2" stroke="#1e272e" stroke-width="6"/>
  <!-- Placa frontal de titanio -->
  <path d="M 100,75 Q 150,55 200,75 L 190,135 Q 150,150 110,135 Z" fill="#808e9b" stroke="#1e272e" stroke-width="4"/>

  <!-- Antena receptora animada -->
  <line x1="150" y1="45" x2="150" y2="15" stroke="#1e272e" stroke-width="5"/>
  <circle cx="150" cy="12" r="10" fill="#00f2fe" stroke="#1e272e" stroke-width="3"/>

  <!-- Visor digital luminoso estilo Synth -->
  <rect x="100" y="95" width="100" height="30" rx="15" fill="#000000" stroke="#00f2fe" stroke-width="4"/>
  <ellipse cx="130" cy="110" rx="10" ry="8" fill="url(#cyborgGlow)"/>
  <ellipse cx="170" cy="110" rx="10" ry="8" fill="url(#cyborgGlow)"/>

  <!-- Altavoz bucal con rejilla de audio -->
  <rect x="130" y="145" width="40" height="12" rx="4" fill="#1e272e"/>
  <line x1="135" y1="151" x2="165" y2="151" stroke="#00f2fe" stroke-width="2"/>
</svg>
