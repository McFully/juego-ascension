<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 350" width="100%" height="100%">
  <defs>
    <radialGradient id="sciSkin" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#dff9fb"/>
      <stop offset="70%" stop-color="#c7ecee"/>
      <stop offset="100%" stop-color="#95afc0"/>
    </radialGradient>
  </defs>

  <!-- Bata y dispositivos cuánticos -->
  <path d="M 60,225 Q 150,205 240,225 L 260,350 L 40,350 Z" fill="#ffffff" stroke="#130f40" stroke-width="5"/>
  <polygon points="150,220 140,290 160,290" fill="#686de0" stroke="#130f40" stroke-width="2"/>

  <!-- Cabeza redonda y expresiva estilo Kirby/Disgaea -->
  <circle cx="150" cy="140" r="65" fill="url(#sciSkin)" stroke="#130f40" stroke-width="6"/>

  <!-- Gafas de científico holográficas gigantes desproporcionadas -->
  <circle cx="120" cy="130" r="26" fill="#7ed6df" stroke="#130f40" stroke-width="6" opacity="0.85"/>
  <circle cx="180" cy="130" r="26" fill="#7ed6df" stroke="#130f40" stroke-width="6" opacity="0.85"/>
  <line x1="146" y1="130" x2="154" y2="130" stroke="#130f40" stroke-width="6"/>
  <!-- Brillo en los lentes -->
  <line x1="105" y1="115" x2="115" y2="145" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <line x1="165" y1="115" x2="175" y2="145" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>

  <!-- Pelo de plasma electrizado -->
  <path d="M 90,95 Q 60,30 110,40 Q 150,10 190,40 Q 240,30 210,95 Z" fill="#e056fd" stroke="#130f40" stroke-width="5"/>
  <polygon points="150,15 140,35 160,35" fill="#f0932b"/>

  <!-- Sonrisa tímida/entusiasta -->
  <ellipse cx="150" cy="175" rx="10" ry="6" fill="#eb4d4b" stroke="#130f40" stroke-width="3"/>
</svg>