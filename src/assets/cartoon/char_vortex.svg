<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 350" width="100%" height="100%">
  <defs>
    <radialGradient id="vortexGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9ff3"/>
      <stop offset="60%" stop-color="#9b59b6"/>
      <stop offset="100%" stop-color="#341f97"/>
    </radialGradient>
    <linearGradient id="cloakGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5f27cd"/>
      <stop offset="100%" stop-color="#222f3e"/>
    </linearGradient>
  </defs>

  <!-- Manto etéreo del Vacío / Umbra -->
  <path d="M 40,240 Q 150,190 260,240 L 290,350 L 10,350 Z" fill="url(#cloakGradient)" stroke="#ff9ff3" stroke-width="4"/>
  <path d="M 120,220 Q 150,280 180,220" fill="none" stroke="#54a0ff" stroke-width="3"/>

  <!-- Capucha oscura flotante -->
  <path d="M 70,160 Q 60,40 150,30 Q 240,40 230,160 Q 200,210 150,205 Q 100,210 70,160 Z" fill="#1b1464" stroke="#ff9ff3" stroke-width="5"/>
  <!-- Interior sombrío -->
  <ellipse cx="150" cy="130" rx="60" ry="50" fill="#000000"/>

  <!-- Núcleo o Ojo cósmico estilo nebulosa/Kirby boss -->
  <circle cx="150" cy="130" r="32" fill="url(#vortexGlow)"/>
  <ellipse cx="150" cy="130" rx="8" ry="24" fill="#ffffff"/>
  <circle cx="150" cy="130" r="6" fill="#10ac84"/>

  <!-- Pequeños orbes gravitacionales satélite -->
  <circle cx="95" cy="85" r="8" fill="#54a0ff" opacity="0.8"/>
  <circle cx="205" cy="85" r="8" fill="#54a0ff" opacity="0.8"/>
</svg>
