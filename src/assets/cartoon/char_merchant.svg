<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 350" width="100%" height="100%">
  <defs>
    <radialGradient id="merchantSkin" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffd32a"/>
      <stop offset="70%" stop-color="#ffaa00"/>
      <stop offset="100%" stop-color="#c47a00"/>
    </radialGradient>
    <linearGradient id="turbanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8854d0"/>
      <stop offset="100%" stop-color="#381d63"/>
    </linearGradient>
  </defs>

  <!-- Halo de monedas flotantes -->
  <circle cx="150" cy="160" r="130" fill="#ffd32a" opacity="0.12" />

  <!-- Capa con ribete de gemas -->
  <path d="M 60,230 Q 150,210 240,230 L 260,350 L 40,350 Z" fill="#381d63" stroke="#1e0f0f" stroke-width="5"/>
  <circle cx="150" cy="245" r="16" fill="#00d8d6" stroke="#1e0f0f" stroke-width="4"/>

  <!-- Cabeza oronda y simpática estilo Rayman -->
  <ellipse cx="150" cy="145" rx="70" ry="60" fill="url(#merchantSkin)" stroke="#1e0f0f" stroke-width="6"/>

  <!-- Turbante espacial gigante -->
  <path d="M 75,115 Q 150,25 225,115 Q 210,75 150,65 Q 90,75 75,115 Z" fill="url(#turbanGrad)" stroke="#1e0f0f" stroke-width="5"/>
  <ellipse cx="150" cy="75" rx="20" ry="15" fill="#ff5e57" stroke="#1e0f0f" stroke-width="3"/>
  <polygon points="150,55 145,25 155,25" fill="#ffdd59"/>

  <!-- Ojos astutos y pícaros con cejas arqueadas -->
  <ellipse cx="125" cy="130" rx="14" ry="18" fill="#ffffff" stroke="#1e0f0f" stroke-width="3"/>
  <circle cx="130" cy="132" r="7" fill="#1e0f0f"/>
  <circle cx="132" cy="128" r="3" fill="#ffffff"/>

  <ellipse cx="175" cy="130" rx="14" ry="18" fill="#ffffff" stroke="#1e0f0f" stroke-width="3"/>
  <circle cx="170" cy="132" r="7" fill="#1e0f0f"/>
  <circle cx="172" cy="128" r="3" fill="#ffffff"/>

  <!-- Nariz de botón y bigote cósmico -->
  <ellipse cx="150" cy="148" rx="12" ry="9" fill="#ff5e57" stroke="#1e0f0f" stroke-width="3"/>
  <path d="M 120,165 Q 150,155 150,165 Q 150,155 180,165 Q 150,185 120,165 Z" fill="#573312" stroke="#1e0f0f" stroke-width="3"/>

  <!-- Sonrisa pícara de comerciante -->
  <path d="M 130,175 Q 150,195 170,175" stroke="#1e0f0f" stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>