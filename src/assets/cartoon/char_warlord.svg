<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 350" width="100%" height="100%">
  <defs>
    <radialGradient id="warlordSkin" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ff4757"/>
      <stop offset="70%" stop-color="#b33939"/>
      <stop offset="100%" stop-color="#581818"/>
    </radialGradient>
    <linearGradient id="armorMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5cd79"/>
      <stop offset="50%" stop-color="#e15f41"/>
      <stop offset="100%" stop-color="#301414"/>
    </linearGradient>
    <linearGradient id="eyeGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8efba"/>
      <stop offset="100%" stop-color="#fffa65"/>
    </linearGradient>
  </defs>

  <!-- Aura cómica de ira / fondo estilizado -->
  <circle cx="150" cy="160" r="130" fill="#ff4757" opacity="0.15" />
  
  <!-- Hombreras colosales de guerrero cartoon -->
  <path d="M 20,240 Q 5,140 70,130 Q 100,180 80,260 Z" fill="url(#armorMetal)" stroke="#1e0f0f" stroke-width="5" stroke-linejoin="round"/>
  <path d="M 280,240 Q 295,140 230,130 Q 200,180 220,260 Z" fill="url(#armorMetal)" stroke="#1e0f0f" stroke-width="5" stroke-linejoin="round"/>
  <!-- Remaches en hombreras -->
  <circle cx="45" cy="165" r="5" fill="#f8efba" stroke="#1e0f0f" stroke-width="2"/>
  <circle cx="60" cy="195" r="5" fill="#f8efba" stroke="#1e0f0f" stroke-width="2"/>
  <circle cx="255" cy="165" r="5" fill="#f8efba" stroke="#1e0f0f" stroke-width="2"/>
  <circle cx="240" cy="195" r="5" fill="#f8efba" stroke="#1e0f0f" stroke-width="2"/>

  <!-- Pectoral acorazado -->
  <path d="M 75,230 Q 150,210 225,230 L 240,350 L 60,350 Z" fill="#2c2c54" stroke="#1e0f0f" stroke-width="5"/>
  <polygon points="150,235 125,290 175,290" fill="#e15f41" stroke="#1e0f0f" stroke-width="3"/>

  <!-- Cuello macizo -->
  <rect x="110" y="160" width="80" height="60" fill="#b33939" stroke="#1e0f0f" stroke-width="4"/>

  <!-- Mandíbula y Cabeza estilo Dragon Quest -->
  <path d="M 80,110 Q 70,180 110,200 Q 150,215 190,200 Q 230,180 220,110 Q 210,40 150,40 Q 90,40 80,110 Z" fill="url(#warlordSkin)" stroke="#1e0f0f" stroke-width="6"/>

  <!-- Cornamenta / Cresta alienígena -->
  <path d="M 120,45 Q 80,-10 60,20 Q 90,35 115,50 Z" fill="url(#armorMetal)" stroke="#1e0f0f" stroke-width="4"/>
  <path d="M 180,45 Q 220,-10 240,20 Q 210,35 185,50 Z" fill="url(#armorMetal)" stroke="#1e0f0f" stroke-width="4"/>

  <!-- Ojos saltones furiosos -->
  <ellipse cx="120" cy="105" rx="18" ry="14" fill="#ffffff" stroke="#1e0f0f" stroke-width="4" transform="rotate(-10 120 105)"/>
  <circle cx="122" cy="106" r="7" fill="#1e0f0f"/>
  <circle cx="125" cy="102" r="3" fill="#ffffff"/>

  <ellipse cx="180" cy="105" rx="18" ry="14" fill="#ffffff" stroke="#1e0f0f" stroke-width="4" transform="rotate(10 180 105)"/>
  <circle cx="178" cy="106" r="7" fill="#1e0f0f"/>
  <circle cx="181" cy="102" r="3" fill="#ffffff"/>

  <!-- Ceño fruncido marcado -->
  <path d="M 100,90 Q 150,115 200,90" stroke="#1e0f0f" stroke-width="7" fill="none" stroke-linecap="round"/>

  <!-- Colmillos y Boca exagerada -->
  <path d="M 115,160 Q 150,185 185,160 Q 150,150 115,160 Z" fill="#4b1212" stroke="#1e0f0f" stroke-width="4"/>
  <!-- Colmillos hacia arriba -->
  <polygon points="125,170 133,145 141,168" fill="#f8efba" stroke="#1e0f0f" stroke-width="2"/>
  <polygon points="159,168 167,145 175,170" fill="#f8efba" stroke="#1e0f0f" stroke-width="2"/>
</svg>