<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgTech" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a18"/>
      <stop offset="100%" stop-color="#0d1b38"/>
    </linearGradient>
    <linearGradient id="cyberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#7000ff"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="20" fill="url(#bgTech)"/>
  <!-- Circuitos de fondo -->
  <path d="M 20,40 L 60,40 L 80,60 M 140,40 L 180,40 M 30,160 L 70,160 L 90,140" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.3" fill="none"/>
  <!-- Silueta de cabeza cibernética -->
  <path d="M 65,140 Q 55,90 80,65 Q 100,45 120,65 Q 145,90 135,140 Z" fill="#1b2845"/>
  <!-- Visor holográfico táctico -->
  <rect x="70" y="80" width="60" height="14" rx="4" fill="url(#cyberGlow)"/>
  <line x1="60" y1="87" x2="140" y2="87" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.8"/>
  <!-- Cuello y hombros acorazados -->
  <path d="M 50,200 L 75,145 L 125,145 L 150,200 Z" fill="#0f172a" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.5"/>
  <!-- Luces de estado -->
  <circle cx="85" cy="165" r="3" fill="#00f0ff"/>
  <circle cx="100" cy="165" r="3" fill="#00ff66"/>
  <circle cx="115" cy="165" r="3" fill="#00f0ff"/>
</svg>