<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradEnergy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c0a02"/>
      <stop offset="60%" stop-color="#1e1804"/>
      <stop offset="100%" stop-color="#060501"/>
    </linearGradient>
    <linearGradient id="goldBeam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#eab308" stop-opacity="0.0"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgGradEnergy)"/>
  <!-- Brutalist Columns -->
  <rect x="80" y="0" width="160" height="1080" fill="#141108" stroke="#eab308" stroke-opacity="0.2"/>
  <rect x="320" y="0" width="120" height="1080" fill="#19150b" stroke="#eab308" stroke-opacity="0.15"/>
  <rect x="1480" y="0" width="120" height="1080" fill="#19150b" stroke="#eab308" stroke-opacity="0.15"/>
  <rect x="1680" y="0" width="160" height="1080" fill="#141108" stroke="#eab308" stroke-opacity="0.2"/>
  <!-- Central Stock Market Hologram Chamber -->
  <ellipse cx="960" cy="540" rx="480" ry="240" fill="none" stroke="#facc15" stroke-width="1.5" stroke-dasharray="10 15" opacity="0.4"/>
  <ellipse cx="960" cy="540" rx="360" ry="180" fill="none" stroke="#ca8a04" stroke-width="1" opacity="0.3"/>
  <ellipse cx="960" cy="540" rx="200" ry="100" fill="none" stroke="#facc15" stroke-width="2" opacity="0.6"/>
  <!-- Gold Hologram Ray -->
  <polygon points="800,0 1120,0 1280,1080 640,1080" fill="url(#goldBeam)"/>
  <!-- Financial Data Tickers in Background -->
  <path d="M 500,420 L 700,380 L 850,450 L 1050,340 L 1250,390 L 1420,310" fill="none" stroke="#facc15" stroke-width="3" opacity="0.5"/>
  <line x1="0" y1="920" x2="1920" y2="920" stroke="#eab308" stroke-width="2" opacity="0.4"/>
</svg>